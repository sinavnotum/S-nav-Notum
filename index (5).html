<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota - LGS Not Paylaşım</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#18181b">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- GÜVENLİK: Firestore Security Rules tanımlayın (sadece giriş yapanlar yazabilsin,
       sadece sahibi silebilsin, doküman boyutu/alanları kontrol edilsin). -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, getDoc, setDoc, updateDoc, doc, onSnapshot, query, orderBy, serverTimestamp, arrayUnion, arrayRemove, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpX9LxAn9dp0UeGdBQ_MR6-bYlwoeexEU",
      authDomain: "sinavnotlari.firebaseapp.com",
      projectId: "sinavnotlari",
      storageBucket: "sinavnotlari.firebasestorage.app",
      messagingSenderId: "911209455642",
      appId: "1:911209455642:web:e3acde1c71ff2bf3b3f1a3",
      measurementId: "G-4220J0YBVZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.firebaseServices = {
      getDoc, setDoc, updateDoc, db, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, arrayUnion, arrayRemove, increment,
      auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile
    };
    window.firebaseReady = true;
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #94a3b855; border-radius: 99px; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body class="bg-zinc-100/70 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" aria-hidden="true" />;
    };

    const Avatar = ({ url, name, size = 'w-7 h-7' }) => (
      url
        ? <img src={url} alt="" className={`${size} rounded-full object-cover border border-zinc-200 dark:border-zinc-700 shrink-0`} />
        : <span className={`${size} rounded-full bg-zinc-200 dark:bg-zinc-700 text-zinc-600 dark:text-zinc-300 flex items-center justify-center text-xs font-semibold shrink-0`}>
            {(name || '?').trim().charAt(0).toUpperCase()}
          </span>
    );

    /* ── LGS dersleri ── */
    const SUBJECTS = [
      'Türkçe', 'Matematik', 'Fen Bilimleri',
      'T.C. İnkılap Tarihi', 'Din Kültürü', 'İngilizce'
    ];
    const MAX_PHOTOS = 3;
    const MAX_PP_CHARS = 400000;
    /* NOT: Aşağıdaki tarih yer tutucudur, gerçek LGS sınav tarihiyle güncelle. */
    const LGS_EXAM_DATE = new Date('2027-06-06T09:00:00');
    const getDaysLeft = () => Math.max(0, Math.ceil((LGS_EXAM_DATE - new Date()) / 86400000));
    const getBadge = (uid, notes) => {
      const count = notes.filter(n => n.userId === uid).length;
      if (count >= 15) return { label: 'Uzman Katkıcı', color: 'text-amber-500 bg-amber-500/10' };
      if (count >= 5) return { label: 'Aktif Katkıcı', color: 'text-emerald-500 bg-emerald-500/10' };
      return null;
    };
    const REPORT_REASONS = ['Uygunsuz içerik', 'Yanlış bilgi', 'Spam / reklam', 'Telif hakkı', 'Diğer'];
    const MAX_TOTAL_CHARS = 850000; // Firestore doküman limiti (~1MB) için güvenli sınır

    const getAuthError = (code) => {
      switch (code) {
        case 'auth/invalid-email': return 'Geçersiz bir e-posta adresi girdiniz.';
        case 'auth/user-disabled': return 'Bu hesap devre dışı bırakılmış.';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return 'E-posta veya şifre hatalı.';
        case 'auth/email-already-in-use': return 'Bu e-posta zaten kullanımda.';
        case 'auth/weak-password': return 'Şifre en az 6 karakter olmalıdır.';
        default: return 'Bir hata oluştu. Tekrar deneyin.';
      }
    };

    const formatDate = (ts) => {
      try {
        if (!ts) return '';
        const d = typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch { return ''; }
    };

    const hasContent = (t) => t && t.trim() !== '';
    const authorOf = (n) => n.authorName || (n.authorEmail ? n.authorEmail.split('@')[0] : 'Anonim');

    /* Fotoğrafı küçültüp JPEG base64'e çevir */
    const compressImage = (file, maxSide = 900, quality = 0.65) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    function App() {
      const [isDark, setIsDark] = useState(() => {
        try { return localStorage.getItem('nota-theme') !== 'light'; } catch { return true; }
      });
      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        try { localStorage.setItem('nota-theme', isDark ? 'dark' : 'light'); } catch {}
      }, [isDark]);

      /* auth */
      const [user, setUser] = useState(null);
      const [displayName, setDisplayName] = useState('');
      const [authLoading, setAuthLoading] = useState(true);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [nickname, setNickname] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authSubmitting, setAuthSubmitting] = useState(false);

      /* notes */
      const [notes, setNotes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeSubject, setActiveSubject] = useState('Tümü');
      const [selectedNote, setSelectedNote] = useState(null);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [lightbox, setLightbox] = useState(null);

      /* profiller / pp / yorumlar */
      const [profiles, setProfiles] = useState({});
      const [myPendingPP, setMyPendingPP] = useState(undefined); // undefined=henüz bilinmiyor, null=yok
      const [pendingPPList, setPendingPPList] = useState([]);
      const [isProfileOpen, setIsProfileOpen] = useState(false);
      const [ppPreview, setPpPreview] = useState(null);
      const [ppBusy, setPpBusy] = useState(false);
      const [comments, setComments] = useState([]);
      const [commentText, setCommentText] = useState('');
      const [commentBusy, setCommentBusy] = useState(false);
      const viewedNotesRef = useRef(new Set());
      const ppFileRef = useRef(null);

      /* yönetim / şikayet */
      const [isAdmin, setIsAdmin] = useState(false);
      const [view, setView] = useState('home');
      const [adminTab, setAdminTab] = useState('reports');
      const [reports, setReports] = useState([]);
      const [reportOpen, setReportOpen] = useState(false);
      const [reportReason, setReportReason] = useState(REPORT_REASONS[0]);
      const [reportBusy, setReportBusy] = useState(false);
      const [toast, setToast] = useState('');

      /* form */
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [title, setTitle] = useState('');
      const [subject, setSubject] = useState(SUBJECTS[0]);
      const [content, setContent] = useState('');
      const [images, setImages] = useState([]);
      const [formError, setFormError] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [imgProcessing, setImgProcessing] = useState(false);
      const fileRef = useRef(null);

      useEffect(() => {
        let unsubNotes = null, unsubAuth = null;
        const init = () => {
          if (!window.firebaseReady || !window.firebaseServices) return;
          const { db, collection, onSnapshot, query, orderBy, auth, onAuthStateChanged, doc, getDoc } = window.firebaseServices;
          unsubAuth = onAuthStateChanged(auth, u => {
            setUser(u);
            setIsAdmin(false);
            if (u) getDoc(doc(db, 'admins', u.uid)).then(sn => setIsAdmin(sn.exists())).catch(() => {});
            setDisplayName(u?.displayName || (u?.email ? u.email.split('@')[0] : ''));
            setAuthLoading(false);
          });
          const q = query(collection(db, 'notes'), orderBy('createdAt', 'desc'));
          unsubNotes = onSnapshot(q, snap => {
            setNotes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            setLoading(false);
          }, err => { console.error(err); setLoading(false); });
        };
        window.firebaseReady ? init() : window.addEventListener('firebase-ready', init);
        return () => { window.removeEventListener('firebase-ready', init); unsubNotes?.(); unsubAuth?.(); };
      }, []);

      /* herkese açık profiller (pp/isim) */
      useEffect(() => {
        if (!window.firebaseReady || !window.firebaseServices) return;
        const { db, collection, onSnapshot } = window.firebaseServices;
        const unsub = onSnapshot(collection(db, 'profiles'), snap => {
          const map = {};
          snap.docs.forEach(d => { map[d.id] = d.data(); });
          setProfiles(map);
        }, err => console.error(err));
        return () => unsub();
      }, []);

      /* kendi bekleyen pp durumum */
      useEffect(() => {
        if (!user || !window.firebaseServices) { setMyPendingPP(null); return; }
        const { db, doc, onSnapshot } = window.firebaseServices;
        const unsub = onSnapshot(doc(db, 'pendingPhotos', user.uid), snap => setMyPendingPP(snap.exists() ? snap.data() : null));
        return () => unsub();
      }, [user]);

      /* yönetici: bekleyen pp listesi */
      useEffect(() => {
        if (!isAdmin || !window.firebaseServices) { setPendingPPList([]); return; }
        const { db, collection, onSnapshot } = window.firebaseServices;
        const unsub = onSnapshot(collection(db, 'pendingPhotos'), snap => setPendingPPList(snap.docs.map(d => ({ id: d.id, ...d.data() }))), err => console.error(err));
        return () => unsub();
      }, [isAdmin]);

      /* seçili notun yorumları + görüntülenme sayacı */
      useEffect(() => {
        setComments([]);
        if (!selectedNote || !window.firebaseServices) return;
        const { db, collection, onSnapshot, query, orderBy, doc, updateDoc, increment } = window.firebaseServices;
        const q = query(collection(db, 'notes', selectedNote.id, 'comments'), orderBy('createdAt', 'asc'));
        const unsub = onSnapshot(q, snap => setComments(snap.docs.map(d => ({ id: d.id, ...d.data() }))), err => console.error(err));
        if (user && !viewedNotesRef.current.has(selectedNote.id)) {
          viewedNotesRef.current.add(selectedNote.id);
          updateDoc(doc(db, 'notes', selectedNote.id), { viewCount: increment(1) }).catch(() => {});
        }
        return () => unsub();
      }, [selectedNote?.id, user]);

      /* şikayetleri sadece yönetici dinler */
      useEffect(() => {
        if (!isAdmin || !window.firebaseServices) { setReports([]); return; }
        const { db, collection, onSnapshot, query, orderBy } = window.firebaseServices;
        const q = query(collection(db, 'reports'), orderBy('createdAt', 'desc'));
        const unsub = onSnapshot(q, snap => setReports(snap.docs.map(d => ({ id: d.id, ...d.data() }))), err => console.error(err));
        return () => unsub();
      }, [isAdmin]);

      const showToast = (m) => { setToast(m); setTimeout(() => setToast(''), 2500); };

      /* auth actions */
      const closeAuthModal = () => { setIsAuthOpen(false); setEmail(''); setPassword(''); setNickname(''); setAuthError(''); };

      const handleAuthSubmit = async (e) => {
        e.preventDefault(); setAuthError('');
        const nick = nickname.trim();
        if (authMode === 'register' && (nick.length < 2 || nick.length > 20)) {
          setAuthError('Takma ad 2-20 karakter olmalıdır.'); return;
        }
        setAuthSubmitting(true);
        try {
          const S = window.firebaseServices;
          if (authMode === 'login') {
            await S.signInWithEmailAndPassword(S.auth, email.trim(), password);
          } else {
            const cred = await S.createUserWithEmailAndPassword(S.auth, email.trim(), password);
            await S.updateProfile(cred.user, { displayName: nick });
            setDisplayName(nick);
          }
          closeAuthModal();
        } catch (err) { setAuthError(getAuthError(err.code)); }
        finally { setAuthSubmitting(false); }
      };

      const handleLogout = async () => {
        try { const { auth, signOut } = window.firebaseServices; await signOut(auth); } catch (e) { console.error(e); }
      };

      const openAddNoteModal = () => {
        if (!user) { setAuthMode('login'); setIsAuthOpen(true); return; }
        if (activeSubject !== 'Tümü') setSubject(activeSubject);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false); setTitle(''); setSubject(SUBJECTS[0]);
        setContent(''); setImages([]); setFormError('');
      };

      /* photos */
      const handleFiles = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length) return;
        const room = MAX_PHOTOS - images.length;
        if (room <= 0) { setFormError(`En fazla ${MAX_PHOTOS} fotoğraf ekleyebilirsin.`); return; }
        setImgProcessing(true); setFormError('');
        try {
          const out = [];
          for (const f of files.slice(0, room)) {
            if (!f.type.startsWith('image/')) continue;
            out.push(await compressImage(f));
          }
          setImages(prev => [...prev, ...out]);
          if (files.length > room) setFormError(`En fazla ${MAX_PHOTOS} fotoğraf eklenebilir.`);
        } catch { setFormError('Fotoğraf işlenemedi.'); }
        finally { setImgProcessing(false); }
      };

      const handleAddNote = async (e) => {
        e.preventDefault();
        if (!title.trim()) { setFormError('Lütfen bir başlık girin.'); return; }
        if (!user) { setFormError('Not eklemek için giriş yapmalısınız.'); return; }
        if (images.join('').length > MAX_TOTAL_CHARS) { setFormError('Fotoğraflar çok büyük. Daha az veya daha küçük fotoğraf ekleyin.'); return; }
        setIsSubmitting(true);
        try {
          const { db, collection, addDoc, serverTimestamp } = window.firebaseServices;
          await addDoc(collection(db, 'notes'), {
            title: title.trim(), subject, content: content.trim(), images,
            createdAt: serverTimestamp(),
            userId: user.uid, authorName: displayName || 'Anonim'
          });
          closeModal();
        } catch (err) { setFormError('Not kaydedilemedi: ' + err.message); }
        finally { setIsSubmitting(false); }
      };

      const handleDeleteNote = async (id) => {
        try {
          const { db, doc, deleteDoc } = window.firebaseServices;
          await deleteDoc(doc(db, 'notes', id));
          if (isAdmin) {
            for (const r of reports.filter(x => x.noteId === id)) {
              try { await deleteDoc(doc(db, 'reports', r.id)); } catch (e) { console.warn(e); }
            }
          }
          setConfirmDeleteId(null);
          if (selectedNote?.id === id) setSelectedNote(null);
        } catch (err) { console.error(err); }
      };

      const openReport = () => {
        if (!user) { setAuthMode('login'); setIsAuthOpen(true); return; }
        setReportReason(REPORT_REASONS[0]); setReportOpen(true);
      };

      const handleReport = async () => {
        if (!user || !selectedNote) return;
        setReportBusy(true);
        try {
          const { db, collection, addDoc, serverTimestamp } = window.firebaseServices;
          await addDoc(collection(db, 'reports'), {
            noteId: selectedNote.id, noteTitle: selectedNote.title,
            reason: reportReason, reporterId: user.uid, createdAt: serverTimestamp()
          });
          setReportOpen(false); showToast('Bildirimin yönetime iletildi. Teşekkürler!');
        } catch (e) { setReportOpen(false); showToast('Bildirim gönderilemedi.'); }
        finally { setReportBusy(false); }
      };

      const dismissReport = async (id) => {
        try { const { db, doc, deleteDoc } = window.firebaseServices; await deleteDoc(doc(db, 'reports', id)); }
        catch (e) { console.error(e); }
      };

      const adminDeleteNote = async (id) => {
        if (!window.confirm('Bu not kalıcı olarak silinsin mi?')) return;
        await handleDeleteNote(id);
        showToast('Not silindi.');
      };

      /* profil fotoğrafı: yükle (onay bekler) */
      const handlePickPP = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file || !file.type.startsWith('image/') || !user) return;
        setPpBusy(true);
        try {
          const dataUrl = await compressImage(file, 400, 0.7);
          if (dataUrl.length > MAX_PP_CHARS) { showToast('Fotoğraf çok büyük, daha küçük bir tane dene.'); return; }
          setPpPreview(dataUrl);
          const { db, doc, setDoc, serverTimestamp } = window.firebaseServices;
          await setDoc(doc(db, 'pendingPhotos', user.uid), {
            photoURL: dataUrl, displayName: displayName || 'Anonim', createdAt: serverTimestamp()
          });
          showToast('Fotoğrafın yönetici onayına gönderildi.');
        } catch (e) { showToast('Fotoğraf yüklenemedi.'); }
        finally { setPpBusy(false); }
      };

      const cancelMyPendingPP = async () => {
        if (!user) return;
        try { const { db, doc, deleteDoc } = window.firebaseServices; await deleteDoc(doc(db, 'pendingPhotos', user.uid)); }
        catch (e) { console.error(e); }
      };

      const approvePP = async (uid, data) => {
        try {
          const { db, doc, setDoc, deleteDoc } = window.firebaseServices;
          await setDoc(doc(db, 'profiles', uid), { photoURL: data.photoURL, displayName: data.displayName || 'Anonim' });
          await deleteDoc(doc(db, 'pendingPhotos', uid));
          showToast('Profil fotoğrafı onaylandı.');
        } catch (e) { showToast('Onaylanamadı.'); }
      };

      const rejectPP = async (uid) => {
        try { const { db, doc, deleteDoc } = window.firebaseServices; await deleteDoc(doc(db, 'pendingPhotos', uid)); showToast('Fotoğraf reddedildi.'); }
        catch (e) { showToast('İşlem başarısız.'); }
      };

      /* beğeni */
      const handleToggleLike = async (note) => {
        if (!user) { setAuthMode('login'); setIsAuthOpen(true); return; }
        try {
          const { db, doc, updateDoc, arrayUnion, arrayRemove } = window.firebaseServices;
          const liked = (note.likedBy || []).includes(user.uid);
          await updateDoc(doc(db, 'notes', note.id), { likedBy: liked ? arrayRemove(user.uid) : arrayUnion(user.uid) });
        } catch (e) { console.error(e); }
      };

      /* yorum */
      const handleAddComment = async (e) => {
        e.preventDefault();
        if (!user || !selectedNote || !commentText.trim()) return;
        setCommentBusy(true);
        try {
          const { db, collection, addDoc, serverTimestamp } = window.firebaseServices;
          await addDoc(collection(db, 'notes', selectedNote.id, 'comments'), {
            text: commentText.trim(), authorId: user.uid, authorName: displayName || 'Anonim', createdAt: serverTimestamp()
          });
          setCommentText('');
        } catch (e) { showToast('Yorum gönderilemedi.'); }
        finally { setCommentBusy(false); }
      };

      const handleDeleteComment = async (commentId) => {
        if (!selectedNote) return;
        try { const { db, doc, deleteDoc } = window.firebaseServices; await deleteDoc(doc(db, 'notes', selectedNote.id, 'comments', commentId)); }
        catch (e) { console.error(e); }
      };

      /* filter */
      const filteredNotes = notes.filter(n => {
        const q = searchQuery.toLowerCase();
        const s = !q || n.title?.toLowerCase().includes(q) || n.content?.toLowerCase().includes(q);
        const c = activeSubject === 'Tümü' || n.subject === activeSubject;
        return s && c;
      });

      const inputCls = "w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:border-zinc-600 focus:ring-2 focus:ring-zinc-500/20 rounded-2xl px-3.5 py-2.5 text-sm outline-none placeholder-zinc-400";
      const iconBtn = "p-2 rounded-xl text-zinc-500 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800 cursor-pointer";

      return (
        <div className="min-h-screen flex flex-col">

          {/* HEADER */}
          <header className="sticky top-0 z-20 bg-white/85 dark:bg-zinc-950/90 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800">
            <div className="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
              <div onClick={() => { setSelectedNote(null); setView('home'); }} className="flex items-center gap-2 cursor-pointer">
                <div className="w-8 h-8 rounded-2xl bg-zinc-800 flex items-center justify-center text-white font-bold">N</div>
                <span className="text-lg font-bold tracking-tight">Nota</span>
                <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-zinc-500/10 text-zinc-600">LGS</span>
              </div>

                    </div>

                            <span className="flex items-center gap-1.5 truncate min-w-0">
                              <Avatar url={profiles[note.userId]?.photoURL} name={authorOf(note)} size="w-4 h-4" />

                                <span className="inline-flex items-center gap-1"><Icon name="image" className="w-3 h-3" />{note.images.length}</span>
                              )}
                              {formatDate(note.createdAt)}
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

          {isProfileOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={() => setIsProfileOpen(false)}>
              <div className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl w-full max-w-sm shadow-2xl p-5" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-lg font-semibold">Profilim</h3>
                  <button onClick={() => setIsProfileOpen(false)} className={iconBtn}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <div className="flex flex-col items-center gap-3 mb-5">
                  <Avatar url={ppPreview || myPendingPP?.photoURL || profiles[user?.uid]?.photoURL} name={displayName} size="w-20 h-20" />
                  <div className="text-sm font-medium">{displayName}</div>
                  {myPendingPP ? (
                    <div className="text-center">
                      <span className="inline-flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-500 mb-2">

                      </span>
                      <div>
                        <button onClick={cancelMyPendingPP} className="text-xs text-zinc-400 hover:text-red-500 cursor-pointer">İsteği iptal et</button>

                    </div>

                    <button type="button" onClick={() => ppFileRef.current?.click()} disabled={ppBusy}
                      className="text-sm font-medium px-4 py-2 rounded-2xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 cursor-pointer disabled:opacity-50">
                      {ppBusy ? 'Yükleniyor...' : 'Fotoğraf Yükle'}
                    </button>
                  )}
                  <input ref={ppFileRef} type="file" accept="image/*" onChange={handlePickPP} className="hidden" />
                </div>
                <p className="text-xs text-zinc-400 text-center">Yüklediğin fotoğraf, yönetici onayından sonra görünür olur.</p>
              </div>
            </div>
          )}

          {reportOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={() => setReportOpen(false)}>

            </div>
          )}

          {/* AUTH MODAL */}
          {isAuthOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={closeAuthModal}>
              <div className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl w-full max-w-sm shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between px-5 py-4 border-b border-zinc-100 dark:border-zinc-800">
                  <h3 className="text-lg font-semibold">{authMode === 'login' ? 'Giriş Yap' : 'Hesap Oluştur'}</h3>
                  <button onClick={closeAuthModal} className={iconBtn}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleAuthSubmit} className="p-5 space-y-3.5">
                  {authError && <div className="text-xs text-red-500 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900/60 px-3 py-2.5 rounded-xl">{authError}</div>}
                  {authMode === 'register' && (
                    <div>
                      <label className="block text-sm font-medium mb-1.5">Takma Ad</label>
                      <input type="text" value={nickname} maxLength={20} onChange={e => setNickname(e.target.value)}
                        placeholder="Notlarda bu isim görünecek" className={inputCls} />
                    </div>
                  )}
                  <div>
                    <label className="block text-sm font-medium mb-1.5">E-posta</label>
                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="ornek@mail.com" className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-sm font-medium mb-1.5">Şifre</label>
                    <input type="password" required minLength="6" value={password} onChange={e => setPassword(e.target.value)} placeholder="En az 6 karakter" className={inputCls} />
                  </div>
                  <button type="submit" disabled={authSubmitting}
                    className="w-full bg-zinc-800 hover:bg-zinc-600 text-white text-sm font-semibold py-2.5 rounded-2xl cursor-pointer disabled:opacity-50">
                    {authSubmitting ? 'Lütfen bekleyin...' : (authMode === 'login' ? 'Giriş Yap' : 'Kayıt Ol')}
                  </button>
                  <button type="button" onClick={() => { setAuthMode(m => m === 'login' ? 'register' : 'login'); setAuthError(''); }}
                    className="w-full text-xs text-zinc-400 hover:text-zinc-600 cursor-pointer pt-1">
                    {authMode === 'login' ? 'Hesabın yok mu? Kayıt Ol' : 'Zaten hesabın var mı? Giriş Yap'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ADD NOTE MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/60 backdrop-blur-sm" onClick={closeModal}>
              <div className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-t-2xl sm:rounded-3xl w-full max-w-lg max-h-[92vh] overflow-y-auto shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between px-5 py-4 border-b border-zinc-100 dark:border-zinc-800 sticky top-0 bg-white dark:bg-zinc-900 z-10">
                  <h3 className="text-lg font-semibold">Yeni Not</h3>
                  <button onClick={closeModal} className={iconBtn}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleAddNote} className="p-5 space-y-4">
                  {formError && <div className="text-xs text-red-500 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900/60 px-3 py-2.5 rounded-xl">{formError}</div>}

                  <div>
                    <label className="block text-sm font-medium mb-1.5">Başlık</label>
                    <input type="text" value={title} onChange={e => { setTitle(e.target.value); setFormError(''); }}
                      placeholder="Örn: Üslü Sayılar Özet" className={inputCls} />
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-1.5">Ders</label>
                    <select value={subject} onChange={e => setSubject(e.target.value)} className={inputCls + " cursor-pointer"}>
                      {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-1.5">İçerik</label>
                    <textarea rows="5" value={content} onChange={e => setContent(e.target.value)}
                      placeholder="Notlarını buraya yaz..." className={inputCls + " resize-y"} />
                  </div>

                  {/* Fotoğraflar */}
                  <div>
                    <label className="block text-sm font-medium mb-1.5">
                      Fotoğraf <span className="text-zinc-400 font-normal">({images.length}/{MAX_PHOTOS})</span>
                    </label>
                    <div className="flex flex-wrap gap-2.5">
                      {images.map((src, i) => (
                        <div key={i} className="relative w-20 h-20">
                          <img src={src} alt="" className="w-full h-full object-cover rounded-2xl border border-zinc-200 dark:border-zinc-700" />
                          <button type="button" onClick={() => setImages(imgs => imgs.filter((_, j) => j !== i))}
                            className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-600 text-white flex items-center justify-center cursor-pointer">
                            <Icon name="x" className="w-3 h-3" />
                          </button>
                        </div>
                      ))}
                      {images.length < MAX_PHOTOS && (
                        <button type="button" onClick={() => fileRef.current?.click()} disabled={imgProcessing}
                          className="w-20 h-20 rounded-2xl border-2 border-dashed border-zinc-300 dark:border-zinc-700 text-zinc-400 hover:border-zinc-600 hover:text-zinc-600 flex flex-col items-center justify-center gap-1 text-xs cursor-pointer disabled:opacity-50">
                          {imgProcessing
                            ? <div className="w-4 h-4 border-2 border-zinc-600 border-t-transparent rounded-full animate-spin"></div>
                            : <><Icon name="image-plus" className="w-5 h-5" /><span>Ekle</span></>}
                        </button>
                      )}
                    </div>
                    <input ref={fileRef} type="file" accept="image/*" multiple onChange={handleFiles} className="hidden" />
                  </div>

                  <div className="flex justify-end gap-2.5 pt-1">
                    <button type="button" onClick={closeModal} className="px-4 py-2 text-sm font-medium text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl cursor-pointer">İptal</button>
                    <button type="submit" disabled={isSubmitting || imgProcessing}
                      className="bg-zinc-800 hover:bg-zinc-600 text-white text-sm font-semibold px-5 py-2 rounded-2xl cursor-pointer disabled:opacity-50">
                      {isSubmitting ? 'Kaydediliyor...' : 'Paylaş'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
