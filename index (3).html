<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nota - LGS Not Paylaşım</title>

  <!-- GÜVENLİK: Firestore Security Rules tanımlayın (sadece giriş yapanlar yazabilsin,
       sadece sahibi silebilsin, doküman boyutu/alanları kontrol edilsin). -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpX9LxAn9dp0UeGdBQ_MR6-bYlwoeexEU",
      authDomain: "sinavnotlari.firebaseapp.com",
      projectId: "sinavnotlari",
      storageBucket: "sinavnotlari.firebasestorage.app",
      messagingSenderId: "911209455642",
      appId: "1:911209455642:web:e3acde1c71ff2bf3b3f1a3",
      measurementId: "G-4220J0YBVZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.firebaseServices = {
      db, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp,
      auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile
    };
    window.firebaseReady = true;
    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #94a3b855; border-radius: 99px; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: ref.current });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex items-center justify-center shrink-0" aria-hidden="true" />;
    };

    /* ── LGS dersleri ── */
    const SUBJECTS = [
      'Türkçe', 'Matematik', 'Fen Bilimleri',
      'T.C. İnkılap Tarihi', 'Din Kültürü', 'İngilizce'
    ];
    const MAX_PHOTOS = 3;
    const MAX_TOTAL_CHARS = 850000; // Firestore doküman limiti (~1MB) için güvenli sınır

    const getAuthError = (code) => {
      switch (code) {
        case 'auth/invalid-email': return 'Geçersiz bir e-posta adresi girdiniz.';
        case 'auth/user-disabled': return 'Bu hesap devre dışı bırakılmış.';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential': return 'E-posta veya şifre hatalı.';
        case 'auth/email-already-in-use': return 'Bu e-posta zaten kullanımda.';
        case 'auth/weak-password': return 'Şifre en az 6 karakter olmalıdır.';
        default: return 'Bir hata oluştu. Tekrar deneyin.';
      }
    };

    const formatDate = (ts) => {
      try {
        if (!ts) return '';
        const d = typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch { return ''; }
    };

    const hasContent = (t) => t && t.trim() !== '';
    const authorOf = (n) => n.authorName || (n.authorEmail ? n.authorEmail.split('@')[0] : 'Anonim');

    /* Fotoğrafı küçültüp JPEG base64'e çevir */
    const compressImage = (file, maxSide = 900, quality = 0.65) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    function App() {
      const [isDark, setIsDark] = useState(() => {
        try { return localStorage.getItem('nota-theme') !== 'light'; } catch { return true; }
      });
      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        try { localStorage.setItem('nota-theme', isDark ? 'dark' : 'light'); } catch {}
      }, [isDark]);

      /* auth */
      const [user, setUser] = useState(null);
      const [displayName, setDisplayName] = useState('');
      const [authLoading, setAuthLoading] = useState(true);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login');
      const [nickname, setNickname] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authSubmitting, setAuthSubmitting] = useState(false);

      /* notes */
      const [notes, setNotes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      const [activeSubject, setActiveSubject] = useState('Tümü');
      const [selectedNote, setSelectedNote] = useState(null);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [lightbox, setLightbox] = useState(null);

      /* form */
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [title, setTitle] = useState('');
      const [subject, setSubject] = useState(SUBJECTS[0]);
      const [content, setContent] = useState('');
      const [images, setImages] = useState([]);
      const [formError, setFormError] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [imgProcessing, setImgProcessing] = useState(false);
      const fileRef = useRef(null);

      useEffect(() => {
        let unsubNotes = null, unsubAuth = null;
        const init = () => {
          if (!window.firebaseReady || !window.firebaseServices) return;
          const { db, collection, onSnapshot, query, orderBy, auth, onAuthStateChanged } = window.firebaseServices;
          unsubAuth = onAuthStateChanged(auth, u => {
            setUser(u);
            setDisplayName(u?.displayName || (u?.email ? u.email.split('@')[0] : ''));
            setAuthLoading(false);
          });
          const q = query(collection(db, 'notes'), orderBy('createdAt', 'desc'));
          unsubNotes = onSnapshot(q, snap => {
            setNotes(snap.docs.map(d => ({ id: d.id, ...d.data() })));
            setLoading(false);
          }, err => { console.error(err); setLoading(false); });
        };
        window.firebaseReady ? init() : window.addEventListener('firebase-ready', init);
        return () => { window.removeEventListener('firebase-ready', init); unsubNotes?.(); unsubAuth?.(); };
      }, []);

      /* auth actions */
      const closeAuthModal = () => { setIsAuthOpen(false); setEmail(''); setPassword(''); setNickname(''); setAuthError(''); };

      const handleAuthSubmit = async (e) => {
        e.preventDefault(); setAuthError('');
        const nick = nickname.trim();
        if (authMode === 'register' && (nick.length < 2 || nick.length > 20)) {
          setAuthError('Takma ad 2-20 karakter olmalıdır.'); return;
        }
        setAuthSubmitting(true);
        try {
          const S = window.firebaseServices;
          if (authMode === 'login') {
            await S.signInWithEmailAndPassword(S.auth, email.trim(), password);
          } else {
            const cred = await S.createUserWithEmailAndPassword(S.auth, email.trim(), password);
            await S.updateProfile(cred.user, { displayName: nick });
            setDisplayName(nick);
          }
          closeAuthModal();
        } catch (err) { setAuthError(getAuthError(err.code)); }
        finally { setAuthSubmitting(false); }
      };

      const handleLogout = async () => {
        try { const { auth, signOut } = window.firebaseServices; await signOut(auth); } catch (e) { console.error(e); }
      };

      const openAddNoteModal = () => {
        if (!user) { setAuthMode('login'); setIsAuthOpen(true); return; }
        if (activeSubject !== 'Tümü') setSubject(activeSubject);
        setIsModalOpen(true);
      };

      const closeModal = () => {
        setIsModalOpen(false); setTitle(''); setSubject(SUBJECTS[0]);
        setContent(''); setImages([]); setFormError('');
      };

      /* photos */
      const handleFiles = async (e) => {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length) return;
        const room = MAX_PHOTOS - images.length;
        if (room <= 0) { setFormError(`En fazla ${MAX_PHOTOS} fotoğraf ekleyebilirsin.`); return; }
        setImgProcessing(true); setFormError('');
        try {
          const out = [];
          for (const f of files.slice(0, room)) {
            if (!f.type.startsWith('image/')) continue;
            out.push(await compressImage(f));
          }
          setImages(prev => [...prev, ...out]);
          if (files.length > room) setFormError(`En fazla ${MAX_PHOTOS} fotoğraf eklenebilir.`);
        } catch { setFormError('Fotoğraf işlenemedi.'); }
        finally { setImgProcessing(false); }
      };

      const handleAddNote = async (e) => {
        e.preventDefault();
        if (!title.trim()) { setFormError('Lütfen bir başlık girin.'); return; }
        if (!user) { setFormError('Not eklemek için giriş yapmalısınız.'); return; }
        if (images.join('').length > MAX_TOTAL_CHARS) { setFormError('Fotoğraflar çok büyük. Daha az veya daha küçük fotoğraf ekleyin.'); return; }
        setIsSubmitting(true);
        try {
          const { db, collection, addDoc, serverTimestamp } = window.firebaseServices;
          await addDoc(collection(db, 'notes'), {
            title: title.trim(), subject, content: content.trim(), images,
            createdAt: serverTimestamp(),
            userId: user.uid, authorName: displayName || 'Anonim'
          });
          closeModal();
        } catch (err) { setFormError('Not kaydedilemedi: ' + err.message); }
        finally { setIsSubmitting(false); }
      };

      const handleDeleteNote = async (id) => {
        try {
          const { db, doc, deleteDoc } = window.firebaseServices;
          await deleteDoc(doc(db, 'notes', id));
          setConfirmDeleteId(null);
          if (selectedNote?.id === id) setSelectedNote(null);
        } catch (err) { console.error(err); }
      };

      /* filter */
      const filteredNotes = notes.filter(n => {
        const q = searchQuery.toLowerCase();
        const s = !q || n.title?.toLowerCase().includes(q) || n.content?.toLowerCase().includes(q);
        const c = activeSubject === 'Tümü' || n.subject === activeSubject;
        return s && c;
      });

      const inputCls = "w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 rounded-xl px-3.5 py-2.5 text-sm outline-none placeholder-slate-400";
      const iconBtn = "p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer";

      return (
        <div className="min-h-screen flex flex-col">

          {/* HEADER */}
          <header className="sticky top-0 z-20 bg-white/85 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div className="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
              <div onClick={() => setSelectedNote(null)} className="flex items-center gap-2 cursor-pointer">
                <div className="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold">N</div>
                <span className="text-lg font-bold tracking-tight">Nota</span>
                <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-500">LGS</span>
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => setIsDark(d => !d)} title={isDark ? 'Açık tema' : 'Koyu tema'} className={iconBtn}>
                  <Icon name={isDark ? 'sun' : 'moon'} className="w-[18px] h-[18px]" />
                </button>
                {!authLoading && (user ? (
                  <>
                    <span className="hidden sm:inline text-sm font-medium text-slate-600 dark:text-slate-300 max-w-[120px] truncate">{displayName}</span>
                    <button onClick={handleLogout} title="Çıkış" className={iconBtn}>
                      <Icon name="log-out" className="w-[18px] h-[18px]" />
                    </button>
                  </>
                ) : (
                  <button onClick={() => { setAuthMode('login'); setIsAuthOpen(true); }}
                    className="text-sm font-medium px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">
                    Giriş
                  </button>
                ))}
                <button onClick={openAddNoteModal}
                  className="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-3 py-1.5 rounded-lg cursor-pointer">
                  <Icon name="plus" className="w-4 h-4" /><span>Not Ekle</span>
                </button>
              </div>
            </div>

            {/* DERS KATEGORİLERİ (üstte) */}
            {!selectedNote && (
              <div className="max-w-3xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto no-scrollbar">
                {['Tümü', ...SUBJECTS].map(s => (
                  <button key={s} onClick={() => setActiveSubject(s)}
                    className={`shrink-0 text-sm font-medium px-3.5 py-1.5 rounded-full border whitespace-nowrap cursor-pointer transition-colors
                      ${activeSubject === s
                        ? 'bg-indigo-600 text-white border-indigo-600'
                        : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700'}`}>
                    {s}
                  </button>
                ))}
              </div>
            )}
          </header>

          {/* MAIN */}
          <main className="max-w-3xl w-full mx-auto px-4 py-5 flex-1">
            {loading ? (
              <div className="flex flex-col items-center py-24">
                <div className="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p className="text-slate-400 text-sm">Yükleniyor...</p>
              </div>

            ) : selectedNote ? (
              <div className="animate-fade-in">
                <div className="flex items-center justify-between mb-4">
                  <button onClick={() => { setSelectedNote(null); setConfirmDeleteId(null); }}
                    className="flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white cursor-pointer">
                    <Icon name="arrow-left" className="w-4 h-4" />Geri
                  </button>
                  {user && selectedNote.userId === user.uid && (
                    confirmDeleteId === selectedNote.id ? (
                      <div className="flex items-center gap-2">
                        <button onClick={() => handleDeleteNote(selectedNote.id)} className="bg-red-600 hover:bg-red-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg cursor-pointer">Evet, Sil</button>
                        <button onClick={() => setConfirmDeleteId(null)} className="bg-slate-200 dark:bg-slate-800 text-xs font-medium px-3 py-1.5 rounded-lg cursor-pointer">Vazgeç</button>
                      </div>
                    ) : (
                      <button onClick={() => setConfirmDeleteId(selectedNote.id)}
                        className="flex items-center gap-1.5 text-sm font-medium text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 px-3 py-1.5 rounded-lg cursor-pointer">
                        <Icon name="trash-2" className="w-4 h-4" />Sil
                      </button>
                    )
                  )}
                </div>

                <article className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-7">
                  <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mb-4">
                    <span className="font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-500">{selectedNote.subject}</span>
                    <span>@{authorOf(selectedNote)}</span>
                    <span>·</span>
                    <span>{formatDate(selectedNote.createdAt)}</span>
                  </div>
                  <h1 className="text-2xl font-bold mb-5 leading-snug">{selectedNote.title}</h1>

                  {hasContent(selectedNote.content) && (
                    <div className="text-slate-700 dark:text-slate-300 leading-relaxed whitespace-pre-wrap break-words">
                      {selectedNote.content}
                    </div>
                  )}

                  {selectedNote.images?.length > 0 && (
                    <div className={`grid gap-3 ${hasContent(selectedNote.content) ? 'mt-6' : ''} grid-cols-1 sm:grid-cols-2`}>
                      {selectedNote.images.map((src, i) => (
                        <img key={i} src={src} alt={`Not fotoğrafı ${i + 1}`} onClick={() => setLightbox(src)}
                          className="w-full rounded-xl border border-slate-200 dark:border-slate-800 cursor-zoom-in object-cover" />
                      ))}
                    </div>
                  )}

                  {!hasContent(selectedNote.content) && !selectedNote.images?.length && (
                    <p className="text-slate-400 italic text-sm">Bu not için içerik girilmemiş.</p>
                  )}
                </article>
              </div>

            ) : (
              <div className="animate-fade-in">
                <div className="relative mb-4">
                  <div className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none flex">
                    <Icon name="search" className="w-4 h-4" />
                  </div>
                  <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                    placeholder="Notlarda ara..." className={inputCls + " pl-10 bg-white dark:bg-slate-900"} />
                </div>

                {filteredNotes.length === 0 ? (
                  <div className="text-center py-16">
                    <p className="font-medium mb-1">{notes.length === 0 ? 'Henüz not yok' : 'Not bulunamadı'}</p>
                    <p className="text-slate-400 text-sm mb-5">
                      {notes.length === 0 ? 'İlk notu sen paylaş.' : 'Farklı bir ders veya arama dene.'}
                    </p>
                    <button onClick={openAddNoteModal}
                      className="inline-flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-xl cursor-pointer">
                      <Icon name="plus" className="w-4 h-4" />Not Ekle
                    </button>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {filteredNotes.map(note => (
                      <div key={note.id} onClick={() => setSelectedNote(note)}
                        className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-indigo-400 dark:hover:border-indigo-500/60 rounded-2xl overflow-hidden cursor-pointer transition-colors flex flex-col">
                        {note.images?.[0] && (
                          <img src={note.images[0]} alt="" className="w-full h-32 object-cover" />
                        )}
                        <div className="p-4 flex flex-col flex-1">
                          <span className="text-xs font-semibold text-indigo-500 mb-1.5">{note.subject}</span>
                          <h2 className="font-semibold line-clamp-1 mb-1">{note.title}</h2>
                          <p className="text-sm text-slate-500 dark:text-slate-400 line-clamp-2 mb-3">
                            {hasContent(note.content) ? note.content : (note.images?.length ? 'Fotoğraflı not' : 'İçerik yok...')}
                          </p>
                          <div className="mt-auto flex items-center justify-between text-xs text-slate-400">
                            <span className="truncate">@{authorOf(note)}</span>
                            <span className="flex items-center gap-2 shrink-0">
                              {note.images?.length > 0 && (
                                <span className="inline-flex items-center gap-1"><Icon name="image" className="w-3 h-3" />{note.images.length}</span>
                              )}
                              {formatDate(note.createdAt)}
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* LIGHTBOX */}
          {lightbox && (
            <div className="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4" onClick={() => setLightbox(null)}>
              <button className="absolute top-4 right-4 text-white p-2 cursor-pointer"><Icon name="x" className="w-6 h-6" /></button>
              <img src={lightbox} alt="" className="max-w-full max-h-full rounded-lg" />
            </div>
          )}

          {/* AUTH MODAL */}
          {isAuthOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={closeAuthModal}>
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl w-full max-w-sm shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="text-lg font-semibold">{authMode === 'login' ? 'Giriş Yap' : 'Hesap Oluştur'}</h3>
                  <button onClick={closeAuthModal} className={iconBtn}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleAuthSubmit} className="p-5 space-y-3.5">
                  {authError && <div className="text-xs text-red-500 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900/60 px-3 py-2.5 rounded-lg">{authError}</div>}
                  {authMode === 'register' && (
                    <div>
                      <label className="block text-sm font-medium mb-1.5">Takma Ad</label>
                      <input type="text" value={nickname} maxLength={20} onChange={e => setNickname(e.target.value)}
                        placeholder="Notlarda bu isim görünecek" className={inputCls} />
                    </div>
                  )}
                  <div>
                    <label className="block text-sm font-medium mb-1.5">E-posta</label>
                    <input type="email" required value={email} onChange={e => setEmail(e.target.value)} placeholder="ornek@mail.com" className={inputCls} />
                  </div>
                  <div>
                    <label className="block text-sm font-medium mb-1.5">Şifre</label>
                    <input type="password" required minLength="6" value={password} onChange={e => setPassword(e.target.value)} placeholder="En az 6 karakter" className={inputCls} />
                  </div>
                  <button type="submit" disabled={authSubmitting}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2.5 rounded-xl cursor-pointer disabled:opacity-50">
                    {authSubmitting ? 'Lütfen bekleyin...' : (authMode === 'login' ? 'Giriş Yap' : 'Kayıt Ol')}
                  </button>
                  <button type="button" onClick={() => { setAuthMode(m => m === 'login' ? 'register' : 'login'); setAuthError(''); }}
                    className="w-full text-xs text-slate-400 hover:text-indigo-500 cursor-pointer pt-1">
                    {authMode === 'login' ? 'Hesabın yok mu? Kayıt Ol' : 'Zaten hesabın var mı? Giriş Yap'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* ADD NOTE MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4 bg-black/60 backdrop-blur-sm" onClick={closeModal}>
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="flex items-center justify-between px-5 py-4 border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900 z-10">
                  <h3 className="text-lg font-semibold">Yeni Not</h3>
                  <button onClick={closeModal} className={iconBtn}><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleAddNote} className="p-5 space-y-4">
                  {formError && <div className="text-xs text-red-500 bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-900/60 px-3 py-2.5 rounded-lg">{formError}</div>}

                  <div>
                    <label className="block text-sm font-medium mb-1.5">Başlık</label>
                    <input type="text" value={title} onChange={e => { setTitle(e.target.value); setFormError(''); }}
                      placeholder="Örn: Üslü Sayılar Özet" className={inputCls} />
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-1.5">Ders</label>
                    <select value={subject} onChange={e => setSubject(e.target.value)} className={inputCls + " cursor-pointer"}>
                      {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium mb-1.5">İçerik</label>
                    <textarea rows="5" value={content} onChange={e => setContent(e.target.value)}
                      placeholder="Notlarını buraya yaz..." className={inputCls + " resize-y"} />
                  </div>

                  {/* Fotoğraflar */}
                  <div>
                    <label className="block text-sm font-medium mb-1.5">
                      Fotoğraf <span className="text-slate-400 font-normal">({images.length}/{MAX_PHOTOS})</span>
                    </label>
                    <div className="flex flex-wrap gap-2.5">
                      {images.map((src, i) => (
                        <div key={i} className="relative w-20 h-20">
                          <img src={src} alt="" className="w-full h-full object-cover rounded-xl border border-slate-200 dark:border-slate-700" />
                          <button type="button" onClick={() => setImages(imgs => imgs.filter((_, j) => j !== i))}
                            className="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-red-600 text-white flex items-center justify-center cursor-pointer">
                            <Icon name="x" className="w-3 h-3" />
                          </button>
                        </div>
                      ))}
                      {images.length < MAX_PHOTOS && (
                        <button type="button" onClick={() => fileRef.current?.click()} disabled={imgProcessing}
                          className="w-20 h-20 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-700 text-slate-400 hover:border-indigo-500 hover:text-indigo-500 flex flex-col items-center justify-center gap-1 text-xs cursor-pointer disabled:opacity-50">
                          {imgProcessing
                            ? <div className="w-4 h-4 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                            : <><Icon name="image-plus" className="w-5 h-5" /><span>Ekle</span></>}
                        </button>
                      )}
                    </div>
                    <input ref={fileRef} type="file" accept="image/*" multiple onChange={handleFiles} className="hidden" />
                  </div>

                  <div className="flex justify-end gap-2.5 pt-1">
                    <button type="button" onClick={closeModal} className="px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl cursor-pointer">İptal</button>
                    <button type="submit" disabled={isSubmitting || imgProcessing}
                      className="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-5 py-2 rounded-xl cursor-pointer disabled:opacity-50">
                      {isSubmitting ? 'Kaydediliyor...' : 'Paylaş'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
